<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Custom checkout · bachs-checkout example</title>
<style>
  :root { color-scheme: light dark; --bg:#0b0c0f; --card:#15171c; --line:#262a33; --fg:#eef1f6; --dim:#98a1b3; --accent:#5b8cff; --ok:#3ecf8e; --bad:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7fb; --card:#fff; --line:#e3e6ee; --fg:#111318; --dim:#5b6474; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:48px auto; padding:0 20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 24px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; padding:9px 14px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  input, select { font:inherit; width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:transparent; color:var(--fg); }
  label { display:block; font-size:12px; color:var(--dim); margin:12px 0 5px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  .instr { margin-top:14px; border-top:1px solid var(--line); padding-top:14px; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:14px; }
  .kv span:first-child { color:var(--dim); }
  .kv span:last-child { text-align:right; word-break:break-all; }
  .status { margin-top:14px; font-size:13px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .dim { color:var(--dim); }
  img.qr { width:150px; height:150px; background:#fff; border-radius:8px; margin-top:10px; }
  pre { background:rgba(127,127,127,.08); padding:12px; border-radius:10px; overflow:auto; font-size:12px; max-height:260px; }
  hr { border:0; border-top:1px solid var(--line); margin:18px 0; }
</style>
</head>
<body>
<main>
  <h1>Custom checkout</h1>
  <p class="sub">Your UI, Bachs' payment rails. Nothing here redirects — account numbers, wallet addresses and approval prompts come straight from the API.</p>

  <div class="card">
    <div class="row">
      <input id="amount" class="mono" value="1.00" style="max-width:110px" aria-label="amount" />
      <select id="currency" style="max-width:110px" aria-label="currency">
        <option>USD</option><option>NGN</option>
      </select>
      <button id="create" class="primary">Create payment request</button>
    </div>

    <div id="session" class="instr" hidden>
      <div class="kv"><span>Session</span><span id="sid" class="mono"></span></div>
      <div class="kv"><span>Amount</span><span id="samount" class="mono"></span></div>
      <hr />
      <div class="row" id="rails"></div>
      <div id="railform" style="margin-top:14px"></div>
      <button id="pay" class="primary" style="margin-top:14px">Pay</button>
      <div id="result" class="instr" hidden></div>
    </div>
  </div>

  <pre id="log" class="dim" style="margin-top:16px" hidden></pre>
</main>

<script type="module">
import { sealCard, deviceInformation } from "/browser.js";

const $ = (id) => document.getElementById(id);
const state = { token: null, rail: "bank", cardConfig: null };

const RAILS = [
  { id: "bank", label: "Bank transfer" },
  { id: "card", label: "Card" },
  { id: "crypto", label: "Crypto" },
  { id: "momo", label: "Mobile money" },
];

function log(obj) {
  const el = $("log");
  el.hidden = false;
  el.textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
}

$("create").onclick = async () => {
  $("result").hidden = true;
  const res = await fetch("/api/session", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ amount: $("amount").value, currency: $("currency").value }),
  }).then((r) => r.json());

  if (res.error) return log(res);
  state.token = res.token;
  $("session").hidden = false;
  $("sid").textContent = res.token;
  $("samount").textContent = `${res.amount} ${res.currency}`;
  renderRails();
};

function renderRails() {
  $("rails").innerHTML = "";
  for (const r of RAILS) {
    const b = document.createElement("button");
    b.textContent = r.label;
    b.setAttribute("aria-pressed", String(state.rail === r.id));
    b.onclick = () => { state.rail = r.id; renderRails(); renderForm(); };
    $("rails").append(b);
  }
  renderForm();
}

function renderForm() {
  const f = $("railform");
  f.innerHTML = "";

  if (state.rail === "card") {
    f.innerHTML = `
      <label>Card number</label><input data-bachs-card="number" inputmode="numeric" placeholder="4242 4242 4242 4242" />
      <div class="grid2">
        <div><label>Expiry</label><input data-bachs-card="expiry" placeholder="MM/YY" /></div>
        <div><label>CVV</label><input data-bachs-card="cvv" inputmode="numeric" placeholder="123" /></div>
      </div>
      <p class="dim" style="font-size:12px;margin-top:10px">Sealed with the vault's RSA key in this page. The server only receives ciphertext.</p>`;
  }

  if (state.rail === "crypto") {
    f.innerHTML = `<label>Corridor</label>
      <select id="corridor"><option>USDT_TRC20</option><option>USDC_SOL</option><option>USDT_BEP20</option></select>`;
  }

  if (state.rail === "momo") {
    f.innerHTML = `<label>Network</label><select id="network"><option value="mtn">MTN</option><option value="vodafone">Vodafone</option></select>
      <label>Phone (international)</label><input id="phone" placeholder="+233201234567" />`;
  }
}

$("pay").onclick = async () => {
  $("result").hidden = false;
  $("result").innerHTML = `<span class="dim">Working…</span>`;

  try {
    let payment;

    if (state.rail === "card") {
      const number = document.querySelector('[data-bachs-card="number"]').value;
      const expiry = document.querySelector('[data-bachs-card="expiry"]').value;
      const cvv = document.querySelector('[data-bachs-card="cvv"]').value;
      const [mm, yy] = expiry.split("/").map((s) => (s || "").trim());

      const pem = await fetch(state.cardConfig.checkoutOrigin + "/api/vault/public-key").then((r) => r.json()).then((j) => j.public_key_pem);
      const sealed = await sealCard(pem, {
        card_number: number.replace(/\s+/g, ""),
        expiry_month: Number(mm),
        expiry_year: yy.length === 2 ? Number("20" + yy) : Number(yy),
        cvv,
      });

      payment = await fetch("/api/pay/card", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: state.token, sealed, device: deviceInformation() }),
      }).then((r) => r.json());
    } else {
      const body = { token: state.token, rail: state.rail };
      if (state.rail === "crypto") body.currency = $("corridor").value;
      if (state.rail === "momo") { body.paymentRail = $("network").value; body.phone = $("phone").value; }
      payment = await fetch("/api/pay", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      }).then((r) => r.json());
    }

    if (payment.error) throw new Error(payment.detail || payment.error);
    renderPayment(payment);
    log(payment);
  } catch (err) {
    $("result").innerHTML = `<span class="bad">${err.message}</span>`;
  }
};

function renderPayment(p) {
  const rows = (obj) => Object.entries(obj)
    .filter(([, v]) => v !== null && v !== "")
    .map(([k, v]) => `<div class="kv"><span>${k}</span><span class="mono">${v}</span></div>`)
    .join("");

  let html = "";
  if (p.type === "bank_transfer") {
    html = `<div class="kv"><span>Transfer exactly</span><span class="mono">${p.amount} ${p.currency}</span></div>` +
           rows(p.instructions);
  } else if (p.type === "crypto") {
    const { qrCode, ...rest } = p.instructions;
    html = rows(rest) + (qrCode ? `<img class="qr" src="${qrCode}" alt="Deposit QR code" />` : "");
  } else if (p.type === "mobile_money") {
    html = rows(p.instructions);
  } else if (p.type === "card") {
    html = `<div class="kv"><span>Card</span><span class="mono">${p.brand || ""} ${p.last4 ? "•••• " + p.last4 : ""}</span></div>` +
           `<div class="kv"><span>Charge</span><span class="mono">${p.chargeId}</span></div>`;
  } else {
    html = rows(p);
  }

  $("result").innerHTML = html + `<div class="status dim" id="pollstatus">watching the charge…</div>`;

  const chargeId = p.chargeId;
  if (chargeId) poll(chargeId);
}

async function poll(chargeId) {
  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 3000));
    const s = await fetch(`/api/status/${state.token}/${chargeId}`).then((r) => r.json());
    const el = document.getElementById("pollstatus");
    if (!el) return;
    const ok = ["succeeded", "paid"].includes(s.charge_status);
    el.className = "status " + (ok ? "ok" : s.attempt_failed ? "bad" : "dim");
    el.textContent = `${s.charge_status} · ${s.substatus || s.attempt_status || ""}` +
      (s.failure_message ? ` · ${s.failure_message}` : "") +
      (ok ? ` · paid ${s.amount_paid}` : "");
    if (ok || s.attempt_failed) return;
  }
}

$("create").click();
fetch("/config").then((r) => r.json()).then((c) => { state.cardConfig = c; });
</script>
</body>
</html>
